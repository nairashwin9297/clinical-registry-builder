# Runs on every push and pull request: backend + data-prep tests, frontend checks, Docker build.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt

      - name: Backend tests (flagging, metrics, API, import, export, README results)
        working-directory: backend
        run: pytest
      - name: Data prep tests
        run: pytest scripts

      # The frontend parity test compares the static demo's JavaScript against Django's exports.
      - name: Export static demo data
        working-directory: backend
        env:
          SQLITE_PATH: /tmp/ci.sqlite3
        run: |
          python manage.py migrate --noinput
          python manage.py import_results
          python manage.py export_static

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests and builds
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
          npm run build:static

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build -t registry-builder .
      - name: Start it and check the app and API respond
        run: |
          docker run -d --name app -p 8000:8000 registry-builder
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/config/ > /dev/null && break; sleep 1; done
          curl -sf http://localhost:8000/ | grep -q '<div id="root">'
          curl -sf http://localhost:8000/api/metrics/ | grep -q '"notes_processed": *100'
      - name: Container logs
        if: always()
        run: docker logs app || true
